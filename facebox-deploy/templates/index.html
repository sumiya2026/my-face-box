<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Face BOX</title>
<style>body{margin:0;background:#f0f2f5;font-family:sans-serif}.top{background:#fff;padding:10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ddd}.logo{background:#ff7a00;color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}.menu{position:fixed;top:0;right:-100%;width:80%;height:100%;background:#fff;transition:.3s;z-index:99;padding:10px;overflow:auto}.menu.open{right:0}.btn{background:#e4e6eb;padding:12px;border-radius:8px;margin:10px 0;cursor:pointer}.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000}.popup.show{display:flex}.box{background:#fff;padding:16px;border-radius:12px;width:90%}.box input,.box textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;background:#f0f2f5}</style>
</head><body>
<div class="top"><div class="logo">f</div><b>facebox</b><span style="margin-left:auto" onclick="document.getElementById('d').classList.add('open')">☰</span></div>
<div id="d" class="menu"><div style="display:flex;gap:10px;align-items:center"> <b>Menu</b> <span style="margin-left:auto" onclick="document.getElementById('d').classList.remove('open')">X</span></div><div class="btn" onclick="document.getElementById('p').classList.add('show');document.getElementById('d').classList.remove('open')">+ Create Facebook Page</div><div>👥 Friends</div><br><div>📊 Dashboard</div><br><div>⚙️ Settings</div></div>
<div style="padding:10px"><div style="background:#fff;padding:15px;border-radius:8px"><b>Your Pages</b><div id="pl"><small>තවම Page නෑ</small></div><br><button onclick="document.getElementById('p').classList.add('show')" style="width:100%;background:#ff7a00;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold">+ Create Page Now</button></div><br><div style="background:#fff;padding:15px;border-radius:8px">Welcome to My Face Box!</div></div>
<div id="p" class="popup" onclick="if(event.target==this)this.classList.remove('show')"><div class="box"><b>Create Page - ඒකම ඇතුලෙම</b><br><br><input id="pn" placeholder="Page Name *"><input id="pc" placeholder="Category"><textarea id="pb" placeholder="Bio"></textarea><input type="file" id="pf"><p id="m" style="color:red"></p><button onclick="createP()" style="width:100%;background:#ff7a00;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;margin-top:8px">Create Page</button><br><button onclick="document.getElementById('p').classList.remove('show')" style="width:100%;margin-top:8px;padding:10px;border:1px solid #ddd;border-radius:8px;background:#fff">Cancel</button></div></div>
<script>
async function createP(){let fd=new FormData();let n=document.getElementById('pn').value.trim();if(!n){document.getElementById('m').innerText='Name එක දාන්න!';return}fd.append('name',n);fd.append('category',document.getElementById('pc').value);fd.append('bio',document.getElementById('pb').value);let f=document.getElementById('pf');if(f.files[0])fd.append('file',f.files[0]);let r=await fetch('/api/page/create',{method:'POST',body:fd});let d=await r.json();if(d.status=='ok'){alert('Created! '+d.page.name);document.getElementById('p').classList.remove('show');loadP()}else document.getElementById('m').innerText=d.msg}
async function loadP(){let r=await fetch('/api/pages');let j=await r.json();let h=j.length==0?'<small>තවම නෑ</small>':'';j.forEach(x=>h+=`<div style='border:1px solid #ddd;padding:8px;border-radius:8px;margin:5px 0'>${x.name}</div>`);document.getElementById('pl').innerHTML=h}loadP();
</script>
</body></html>
