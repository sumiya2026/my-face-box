<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register</title>
<style>*{box-sizing:border-box;font-family:Arial} body{background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh} .box{background:white;padding:24px;border-radius:16px;width:90%;max-width:400px} input{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:10px} button{width:100%;padding:14px;background:#ff7a00;color:white;border:none;border-radius:10px;font-weight:bold}</style>
</head><body>
<div class="box"><h2>Create Account</h2><small>එකම Phone/NIC එකෙන් ඕන තරම් ✅</small>
<input id="name" placeholder="Full Name"><input id="phone" placeholder="Phone Number *"><input id="nic" placeholder="NIC Number *">
<button onclick="register()">Create Account</button><p id="msg"></p></div>
<script>
async function register(){
 let data={name:document.getElementById('name').value, phone:document.getElementById('phone').value, nic:document.getElementById('nic').value};
 let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 let d=await r.json(); if(d.status=='ok'){alert('Account හැදුණා!'); location.href='/';} else{document.getElementById('msg').innerText=d.msg;}
}
</script>
</body></html>
