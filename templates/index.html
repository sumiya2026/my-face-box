<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Face BOX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <style>
        body{font-family:Arial,sans-serif;margin:0;background:#f0f2f5;color:#1c1e21;padding-bottom:20px;-webkit-text-size-adjust:100%}
        .top-nav{display:flex;justify-content:space-between;align-items:center;background:white;padding:8px 12px;position:sticky;top:0;z-index:100;border-bottom:1px solid #e4e6eb}
        .logo-area{display:flex;align-items:center;gap:8px}
        .logo-icon{width:38px;height:38px;background:#FF6B00;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:bold}
        .logo-text{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:bold;color:#FF6B00;letter-spacing:-0.5px}
        .top-icons{display:flex;gap:10px}
        .top-icons button{width:40px;height:40px;background:#e4e6eb;border:none;border-radius:50%;font-size:18px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
        .badge-red{position:absolute;top:-4px;right:-4px;background:#e41e3f;color:white;font-size:11px;font-weight:bold;padding:2px 6px;border-radius:10px}
        .nav-tabs{display:flex;background:white;border-bottom:1px solid #e4e6eb;position:sticky;top:56px;z-index:99}
        .tab-btn{flex:1;text-align:center;background:none;border:none;padding:12px 0;font-size:24px;color:#65676b;cursor:pointer;position:relative}
        .tab-btn.active{color:#FF6B00}
        .tab-btn.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:#FF6B00}
        .tab-badge{position:absolute;top:4px;right:22%;background:#e41e3f;color:white;font-size:10px;font-weight:bold;padding:2px 5px;border-radius:10px}
        .post-create{background:white;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
        .avatar{width:40px;height:40px;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0}
        .post-input{background:#f0f2f5;border:1px solid #e4e6eb;padding:10px 16px;border-radius:20px;flex:1;font-size:15px;color:#65676b;cursor:pointer;text-align:left}
        .stories-container{display:flex;gap:8px;padding:12px;overflow-x:auto;background:white;margin-bottom:8px}
        .story-card{min-width:110px;height:185px;background:#ccc;border-radius:12px;position:relative;background-size:cover;background-position:center;flex-shrink:0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,0.2)}
        .story-add{width:32px;height:32px;background:#FF6B00;border-radius:50%;border:3px solid white;position:absolute;top:8px;left:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px}
        .story-avatar{width:34px;height:34px;border-radius:50%;border:3px solid #FF6B00;position:absolute;top:8px;left:8px;background-size:cover;background-position:center;background-color:#ddd}
        .story-name{position:absolute;bottom:8px;left:8px;right:8px;color:white;font-size:13px;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,0.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .feed-post{background:white;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
        .post-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
        .user-info{display:flex;align-items:center;gap:10px}
        .post-author{font-weight:bold;font-size:15px}
        .post-meta{font-size:12px;color:#65676b;display:flex;align-items:center;gap:4px}
        .post-body{font-size:15px;line-height:1.4;margin:10px 0;word-wrap:break-word}
        .post-image{width:100%;border-radius:8px;margin-top:8px}
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="logo-area"><div class="logo-icon">f</div><div class="logo-text">MY FACE BOX</div></div>
        <div class="top-icons">
            <button onclick="location.href='/add-post'"><i class="fas fa-plus"></i></button>
            <button onclick="location.href='/search'"><i class="fas fa-search"></i></button>
            <button onclick="location.href='/messages'"><i class="fab fa-facebook-messenger"></i><span class="badge-red">2</span></button>
        </div>
    </div>
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="location.href='/'"><i class="fas fa-home"></i></button>
        <button class="tab-btn" onclick="location.href='/videos'"><i class="fas fa-tv"></i></button>
        <button class="tab-btn" onclick="location.href='/friends'"><i class="fas fa-user-friends"></i><span class="tab-badge">9+</span></button>
        <button class="tab-btn" onclick="location.href='/marketplace'"><i class="fas fa-store"></i></button>
        <button class="tab-btn" onclick="location.href='/notifications'"><i class="fas fa-bell"></i><span class="tab-badge">9+</span></button>
        <button class="tab-btn" onclick="location.href='/menu'"><i class="fas fa-bars"></i></button>
    </div>

    <div class="post-create">
        <div class="avatar" style="background-image:url('https://i.pravatar.cc/150?img=15')"></div>
        <div class="post-input" onclick="location.href='/create-post'">What's on your mind?</div>
        <i class="fas fa-images" style="font-size:28px;color:#45bd62;cursor:pointer" onclick="location.href='/create-post'"></i>
    </div>

    <div class="stories-container">
        <div class="story-card" style="background-image:url('https://picsum.photos/200/300?random=1')">
            <div class="story-add"><i class="fas fa-plus"></i></div>
            <div class="story-name">Create story</div>
        </div>
        <div class="story-card" style="background-image:url('https://picsum.photos/200/300?random=10')">
            <div class="story-avatar" style="background-image:url('https://i.pravatar.cc/100?img=33')"></div>
            <div class="story-name">Aluminium Sc...</div>
        </div>
        <div class="story-card" style="background-image:url('https://picsum.photos/200/300?random=20')">
            <div class="story-avatar" style="background-image:url('https://i.pravatar.cc/100?img=12')"></div>
            <div class="story-name">Gamini Wijera...</div>
        </div>
        <div class="story-card" style="background-image:url('https://picsum.photos/200/300?random=21')">
            <div class="story-avatar" style="background-image:url('https://i.pravatar.cc/100?img=18')"></div>
            <div class="story-name">Nimal</div>
        </div>
    </div>

    <div class="feed-post">
        <div class="post-header">
            <div class="user-info">
                <div class="avatar" style="background-image:url('https://i.pravatar.cc/150?img=32')"></div>
                <div>
                    <div class="post-author">Mahesh K Somaratne</div>
                    <div class="post-meta">14h • <i class="fas fa-globe"></i></div>
                </div>
            </div>
            <i class="fas fa-ellipsis-h" style="color:#65676b"></i>
        </div>
        <div class="post-body">මේ ඡායාරූපයේ ඉන්නේ කොටි සංවිධානේ... <span style="color:#65676b">See more</span></div>
        <img class="post-image" src="https://picsum.photos/600/400?random=5" alt="Post Image">
    </div>
</body>
</html>
