<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-select: none">
<title>My Face Box</title>
<style>
    * {
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  body { margin:0; font-family: sans-serif; background:#000; color:#fff; padding-bottom:70px; }
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #111;
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 9999;
    user-select: none;
    -webkit-user-drag: none;
  }
  .nav-item {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .nav-item:active { background: #222; }
</style>
</head>
<body>

<div id="app">Loading My Face Box...</div>

<div class="bottom-nav" style="user-select:none; -webkit-user-drag:none;">
  <div oncontextmenu="return false;" ontouchstart="event.preventDefault()" class="nav-item" onclick="location.href='#'">🏠<br>Home</div>
  <div oncontextmenu="return false;" ontouchstart="event.preventDefault()" class="nav-item" onclick="alert('Story')">📌<br>Story</div>
  <div oncontextmenu="return false;" ontouchstart="event.preventDefault()" class="nav-item" onclick="alert('Reels')">🎬<br>Reels</div>
  <div oncontextmenu="return false;" ontouchstart="event.preventDefault()" class="nav-item" onclick="alert('Messenger')">💬<br>Messenger</div>
  <div oncontextmenu="return false;" ontouchstart="event.preventDefault()" class="nav-item" onclick="alert('Profile')">👤<br>Profile</div>
</div>

<script>
// Prevent Google search bottom sheet
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
</script>

</body>
</html>
