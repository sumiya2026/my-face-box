<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Face BOX</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#f0f2f5}.header{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 4px rgba(0,0,0,.1);position:sticky;top:0;z-index:100}.logo{color:#ff6a00;font-weight:900;font-size:22px}.logo span{background:#ff6a00;color:#fff;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-right:6px}.nav{display:flex;justify-content:space-around;background:#fff;padding:8px 0;position:sticky;top:52px;z-index:90;border-bottom:1px solid #ddd}.composer{background:#fff;padding:12px;display:flex;gap:8px;margin:8px 0}.composer img{width:40px;height:40px;border-radius:50%}.composer input{flex:1;background:#f0f2f5;border:none;border-radius:20px;padding:10px 15px}.post{background:#fff;margin:8px 0;padding:12px}.p-head{display:flex;gap:10px}.p-head img{width:40px;height:40px;border-radius:50%}.p-img{width:100%;max-height:350px;object-fit:cover;border-radius:8px;margin-top:8px}.actions{display:flex;justify-content:space-around;border-top:1px solid #eee;margin-top:10px;padding-top:8px;color:#65676b;font-weight:600}.act{cursor:pointer}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:999}.modalBox{background:#fff;padding:20px;border-radius:12px;width:90%;max-width:350px}.login{position:fixed;inset:0;background:#f0f2f5;display:flex;align-items:center;justify-content:center;z-index:1000}.loginBox{background:#fff;padding:25px;border-radius:12px;width:90%;max-width:360px;text-align:center}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:6px 0}button{width:100%;padding:12px;background:#ff6a00;color:#fff;border:none;border-radius:8px;font-weight:bold}</style></head><body>
<div id="loginPage" class="login"><div class="loginBox"><h2 style="color:#ff6a00">MY FACE BOX</h2><p style="font-size:12px;color:gray">OTP = 123456</p><input id="ph" placeholder="Phone"><button onclick="document.getElementById('otpB').style.display='block'">OTP යවන්න</button><div id="otpB" style="display:none"><input placeholder="123456"><button onclick="go()">Login</button></div></div></div>
<div id="main"><div class="header"><div class="logo"><span>f</span>MY FACE BOX</div><div style="display:flex;gap:8px"><div onclick="document.getElementById('t').focus()" style="background:#e4e6eb;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer">+</div><div onclick="showM('Search')" style="background:#e4e6eb;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer">🔍</div><div onclick="openMenu()" style="background:#e4e6eb;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer">☰</div></div></div><div class="nav"><div>🏠</div><div onclick="showM('Watch')">📺</div><div onclick="showM('Friends')">👥</div><div onclick="showM('Market')">🏪</div><div onclick="showM('Notify')">🔔</div></div><div class="composer"><img src="https://i.pravatar.cc/100"><input id="t" placeholder="What's on your mind?"><input type="file" id="imgIn" accept="image/*" hidden><span onclick="imgIn.click()" style="cursor:pointer">🖼️</span><button onclick="createPost()" style="width:auto;padding:8px 16px;border-radius:20px">Post</button></div><div id="feed"></div></div>
<div id="menuModal" class="modal" onclick="this.style.display='none'"><div class="modalBox" onclick="event.stopPropagation()"><h3>Menu</h3><div style="padding:12px;border-bottom:1px solid #eee" onclick="showM('Profile')">👤 Profile</div><div style="padding:12px;border-bottom:1px solid #eee" onclick="showM('Settings')">⚙️ Settings</div><div style="padding:12px;color:red" onclick="localStorage.clear();location.reload()">🚪 Logout</div><button onclick="document.getElementById('menuModal').style.display='none'" style="margin-top:10px;background:#ddd;color:#000">Close</button></div></div>
<div id="popModal" class="modal" onclick="this.style.display='none'"><div class="modalBox" onclick="event.stopPropagation()"><p id="popText"></p><button onclick="document.getElementById('popModal').style.display='none'" style="margin-top:10px">OK</button></div></div>
<script>
let selImg="";
imgIn.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let max=500;let w=img.width,h=img.height;if(w>max||h>max){if(w>h){h*=max/w;w=max}else{w*=max/h;h=max}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);selImg=c.toDataURL('image/jpeg',0.5);showM('Photo Added ✅');};img.src=ev.target.result;};r.readAsDataURL(f);});
function go(){document.getElementById('loginPage').style.display='none';load();}
function createPost(){let c=t.value.trim();if(!c&&!selImg){showM('Text එකක් දාන්න!');return;}fetch('/api/create-post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'User',content:c,image:selImg})}).then(()=>{t.value='';selImg='';load()})}
function load(){fetch('/api/feed').then(r=>r.json()).then(d=>{let h='';d.posts.forEach(p=>{h+=`<div class="post"><div class="p-head"><img src="https://i.pravatar.cc/100?img=${p.id%70}"><div><b>${p.name}</b><br><small style="color:gray">Just now • 🌍</small></div></div><div style="margin-top:8px">${p.content}</div>${p.image?`<img class="p-img" src="${p.image}">`:''}<div style="color:gray;font-size:13px;margin-top:6px">❤️ ${p.likes} Likes • ${p.comments.length} Comments</div><div class="actions"><div class="act" onclick="likePost(${p.id})">👍 Like</div><div class="act" onclick="document.getElementById('ci${p.id}').focus()">💬 Comment</div><div class="act" onclick="showM('Link Copied!')">↗️ Share</div></div><div>${p.comments.map(x=>`<div style="background:#f0f2f5;display:inline-block;padding:5px 10px;border-radius:12px;margin:3px 0;font-size:13px"><b>${x.name}:</b> ${x.text}</div><br>`).join('')}</div><div style="display:flex;gap:6px;margin-top:8px"><img src="https://i.pravatar.cc/100" style="width:32px;height:32px;border-radius:50%"><input id="ci${p.id}" placeholder="Comment..." onkeydown="if(event.key==='Enter') commentPost(${p.id})" style="flex:1;background:#f0f2f5;border:none;border-radius:20px;padding:8px 12px"></div></div>`});feed.innerHTML=h||'<div style="text-align:center;padding:30px;color:gray">No Posts! එකක් දාන්න!</div>'})}
function likePost(id){fetch('/api/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(()=>load())}
function commentPost(id){let i=document.getElementById('ci'+id);let tx=i.value.trim();if(!tx)return;fetch('/api/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,name:'User',text:tx})}).then(()=>load())}
function openMenu(){menuModal.style.display='flex'}
function showM(t){popText.innerText=t;popModal.style.display='flex'}
</script></body></html>
