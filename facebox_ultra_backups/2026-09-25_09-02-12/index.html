<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Face BOX</title>
<style>body{margin:0;font-family:sans-serif;background:#f0f2f5}.header{background:#ff7a00;color:white;padding:12px;font-weight:bold;position:sticky;top:0}.card{background:white;margin:8px;padding:12px;border-radius:10px}.page{display:flex;padding:12px;background:white;margin:8px;border-radius:10px}.page img{width:50px;height:50px;border-radius:50%;margin-right:10px}#loginOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px}.loginBox{background:white;border-radius:16px;padding:24px;width:100%;max-width:360px;text-align:center}.loginBox input{width:92%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}.loginBox button{width:98%;padding:14px;background:#ff7a00;color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:8px}.box{display:none}.box.active{display:block}#debugOTP{background:#e8ffe8;border:2px dashed green;padding:10px;margin:10px 0;border-radius:8px;font-weight:bold;display:none}</style></head><body>
<div id="loginOverlay"><div class="loginBox"><h2 style="color:#ff7a00;margin:0">MY FACE BOX</h2>
<div id="phoneBox" class="box active"><p>Phone Number එක දාන්න</p><input id="phoneInput" placeholder="07XXXXXXXX" value="0712345678" type="tel"><button onclick="sendOTP()">Send OTP</button><p id="phoneMsg"></p></div>
<div id="otpBox" class="box"><p>OTP Code - <b id="showPhone"></b></p><div id="debugOTP"></div><input id="otpInput" placeholder="6 digit" maxlength="6" type="tel"><button onclick="verifyOTP()">Verify OTP</button><p id="otpMsg" style="color:red"></p><p onclick="showBox('phoneBox')" style="color:#0064d1;font-size:12px">← Back</p></div>
<div id="nameBox" class="box"><p style="font-weight:bold;font-size:18px">ඔයාගේ නම දාන්න</p><input id="nameInput" placeholder="උදා: Nimal" type="text"><button onclick="saveName()">Continue →</button></div>
</div></div>
<div class="header">MY FACE BOX - <span id="userDisplay"></span></div>
<div class="card"><input id="postInput" placeholder="What's on your mind?" style="width:70%;padding:10px;border:none;background:#f0f2f5;border-radius:20px"><button onclick="createPost()" style="background:#ff7a00;color:white;border:none;padding:8px 12px;border-radius:15px">Post</button></div>
<div id="pagesList"></div><div id="postsList"></div>
<script>
let currentPhone=localStorage.getItem('myfacebox_phone')||"";let currentName=localStorage.getItem('myfacebox_name')||"";
if(currentPhone&&currentName){document.getElementById('loginOverlay').style.display='none';document.getElementById('userDisplay').innerText=currentName+" ("+currentPhone+")";}
function showBox(id){document.querySelectorAll('.box').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');}
function sendOTP(){const phone=document.getElementById('phoneInput').value.trim();if(phone.length<9){alert('Number එක හරියට දාන්න');return}currentPhone=phone;document.getElementById('phoneMsg').innerText="Sending...";fetch('/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})}).then(r=>r.json()).then(d=>{if(d.success){showBox('otpBox');document.getElementById('showPhone').innerText=phone;if(d.debug_code){document.getElementById('debugOTP').style.display='block';document.getElementById('debugOTP').innerHTML="OTP: <span style='font-size:26px;letter-spacing:4px'>"+d.debug_code+"</span>";document.getElementById('otpInput').value=d.debug_code;}document.getElementById('phoneMsg').innerText="";}});}
function verifyOTP(){const code=document.getElementById('otpInput').value.trim();fetch('/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:currentPhone,code})}).then(r=>r.json()).then(d=>{if(d.success){localStorage.setItem('myfacebox_phone',currentPhone);showBox('nameBox');}else{document.getElementById('otpMsg').innerText=d.message;}});}
function saveName(){const name=document.getElementById('nameInput').value.trim();if(name.length<2){alert('නම දාන්න');return}currentName=name;localStorage.setItem('myfacebox_name',name);document.getElementById('loginOverlay').style.display='none';document.getElementById('userDisplay').innerText=name+" ("+currentPhone+")";loadFeed();}
function loadFeed(){fetch('/api/feed').then(r=>r.json()).then(d=>{document.getElementById('pagesList').innerHTML=d.pages.map(p=>`<div class=page><img src="https://i.pravatar.cc/100?img=${p.id%70}"><div><b>${p.name}</b><br><small>${p.description}</small></div></div>`).join('');document.getElementById('postsList').innerHTML=d.posts.map(p=>`<div class=card><b>${p.phone}</b><br>${p.content}</div>`).join('');});}
function createPost(){const content=document.getElementById('postInput').value;fetch('/api/create-post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,phone:currentName||currentPhone})}).then(r=>r.json()).then(d=>{if(d.success){document.getElementById('postInput').value='';loadFeed();}});}
loadFeed();
</script></body></html>
